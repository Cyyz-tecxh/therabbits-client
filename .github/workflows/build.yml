name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: TheRabbits-Client
          path: build/libs/*.jar
      - name: Publish latest jar as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "TheRabbits Client (latest build)" --notes "Built automatically from ${GITHUB_SHA::7}"
      - name: Dump Minecraft API (for development)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          JAR=$(find .gradle/loom-cache ~/.gradle/caches -name 'minecraft-merged*1.21.11*.jar' -not -name '*sources*' 2>/dev/null | head -1)
          echo "JAR=$JAR" > api.txt
          unzip -l "$JAR" | awk '{print $4}' | grep -iE 'outline|fog|glint|hitbox|ItemEntityRenderer|ItemInHand|PostChain|Cooldown|Title|DebugScreenEntr|ShapeRenderer|BlockOutline|LevelRenderer|PlayerTabOverlay|AbstractContainerScreen|EntityRenderDispatcher|FeatureRenderDispatcher|SubmitNodeCollector' | grep -v '\$' | head -80 >> api.txt
          for c in net.minecraft.client.renderer.entity.EntityRenderDispatcher net.minecraft.client.renderer.ItemInHandRenderer net.minecraft.client.renderer.LevelRenderer net.minecraft.client.renderer.fog.FogRenderer net.minecraft.client.renderer.entity.ItemEntityRenderer net.minecraft.client.renderer.entity.state.ItemEntityRenderState net.minecraft.client.gui.Gui net.minecraft.client.renderer.GameRenderer net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.client.gui.components.PlayerTabOverlay net.minecraft.world.item.ItemCooldowns net.minecraft.client.renderer.ShapeRenderer net.minecraft.client.renderer.debug.DebugRenderer net.minecraft.client.gui.components.debug.DebugScreenEntries net.minecraft.client.renderer.PostChain net.minecraft.client.renderer.ShaderManager net.minecraft.client.gui.components.debug.DebugScreenEntryList net.minecraft.network.chat.FontDescription net.minecraft.network.chat.Style net.minecraft.client.renderer.entity.layers.RenderLayer net.minecraft.client.renderer.entity.player.AvatarRenderer net.minecraft.client.renderer.entity.state.AvatarRenderState net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.OrderedSubmitNodeCollector net.minecraft.client.model.geom.ModelPart net.minecraft.client.model.player.PlayerModel net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.special.ShieldSpecialRenderer net.minecraft.client.model.object.equipment.ShieldModel net.minecraft.client.model.ShieldModel net.minecraft.client.renderer.special.SpecialModelRenderer net.minecraft.client.renderer.entity.layers.ItemInHandLayer net.minecraft.client.renderer.item.ItemStackRenderState net.minecraft.client.renderer.entity.state.ArmedEntityRenderState net.minecraft.client.renderer.debug.EntityHitboxDebugRenderer net.minecraft.client.renderer.entity.state.HitboxRenderState net.minecraft.client.renderer.entity.state.HitboxesRenderState net.minecraft.client.multiplayer.ClientLevel net.minecraft.client.multiplayer.ClientLevel$ClientLevelData net.minecraft.world.level.Level net.minecraft.client.gui.components.DebugScreenOverlay net.minecraft.client.User net.minecraft.client.User$Type net.minecraft.client.renderer.WeatherEffectRenderer net.minecraft.client.renderer.SkyRenderer net.minecraft.server.packs.repository.PackRepository net.minecraft.client.renderer.debug.DebugRenderer net.minecraft.client.gui.components.debug.DebugScreenEntryStatus net.minecraft.client.gui.components.debug.DebugScreenEntry net.minecraft.client.multiplayer.ClientPacketListener net.minecraft.client.renderer.state.LevelRenderState net.minecraft.client.gui.screens.ChatScreen net.minecraft.client.KeyMapping com.mojang.blaze3d.platform.InputConstants net.minecraft.client.renderer.entity.state.EntityRenderState$HitboxState; do
            echo "=== $c" >> api.txt; javap -p -cp "$JAR" $c 2>&1 | head -150 >> api.txt; done
          javap -p -cp "$JAR" net.minecraft.client.Options | grep -iE "glint|fog|bob|fov|hitbox|guiScale|OptionInstance<|chat" >> api.txt
          javap -p -cp "$JAR" net.minecraft.client.Minecraft | grep -iE 'debug' >> api.txt
          unzip -l "$JAR" | awk '{print $4}' | grep -i shield >> api.txt
          FAPI=$(find .gradle/loom-cache -name 'fabric-rendering-v1*.jar' | head -1)
          echo "=== FAPI $FAPI" >> api.txt
          unzip -l "$FAPI" | awk '{print $4}' | grep -i 'class$' | grep -iE 'feature|layer' >> api.txt
          for c in net.fabricmc.fabric.api.client.rendering.v1.LivingEntityFeatureRendererRegistrationCallback 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityFeatureRendererRegistrationCallback$RegistrationHelper' net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback$RegistrationHelper'; do
            echo "=== $c" >> api.txt; javap -p -cp "$FAPI:$JAR" "$c" >> api.txt 2>&1; done
      - name: Run in-game showcase
        id: showcase
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils ffmpeg > /dev/null
          for attempt in 1 2 3 4 5; do
            LP_NUM_THREADS=1 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace > showcase.log 2>&1 && break
            grep -q "Timeout loading world" showcase.log || break
            echo "World load timed out, retrying ($attempt)"
          done
          tail -50 showcase.log
      - name: Publish screenshots and logs
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          find . -path ./out -prune -o -name '*.png' -path '*screenshot*' -print -exec cp {} out/ \; || true
          (cd out && for f in *.png; do ffmpeg -loglevel error -y -i "$f" -q:v 2 "${f%.png}.jpg" && rm "$f"; done; zip -q ../screenshots.zip *.jpg) || true
          ls -la screenshots.zip || true
          find . -name latest.log -path '*run*' -exec cp {} out-latest.log \; || true
          gh release delete showcase --yes --cleanup-tag || true
          gh release create showcase --title "Showcase run" --notes "Automated showcase" --prerelease \
            $(ls screenshots.zip build.log showcase.log out-latest.log api.txt 2>/dev/null)
